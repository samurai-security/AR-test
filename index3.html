<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>AR Avatar - Akane (index3)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <style>
    html, body {
      margin: 0; padding: 0; overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif;
      width: 100%; height: 100%;
    }

    #camera-video {
      position: fixed; top:0; left:0;
      width:100%; height:100%;
      object-fit:cover; z-index:0;
    }

    #three-canvas {
      position: fixed; top:0; left:0;
      width:100%; height:100%; z-index:1;
    }

    /* === AR02 強化: チャットUI === */
    #chat-container {
      position: fixed; bottom:0; left:0; right:0;
      z-index:10; padding:0 6px 12px 6px;
    }

    #chat-panel {
      position: relative;
      background: rgba(6, 25, 40, 0.82);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(0, 255, 255, 0.45);
      /* 二重グロー */
      box-shadow:
        0 0 16px rgba(0,255,255,0.55),
        inset 0 0 22px rgba(0,150,255,0.35);
      /* ハニカムマスク（強） */
      mask-image: repeating-linear-gradient(
        60deg,
        rgba(0,0,0,0.95) 0px, rgba(0,0,0,0.95) 4px,
        rgba(0,0,0,0.75) 4px, rgba(0,0,0,0.75) 8px
      );
      mask-size: 12px 12px;
    }

    /* 左右エッジ */
    #edge-left, #edge-right {
      position: absolute; top:0; bottom:0; width:5px;
      background: linear-gradient(180deg,
        rgba(0,255,255,1) 0%,
        rgba(0,200,255,0.9) 50%,
        rgba(0,255,255,1) 100%);
      box-shadow:
        0 0 18px rgba(0,255,255,0.95),
        0 0 30px rgba(0,255,255,0.7);
      z-index:12;
    }
    #edge-left { left:0; }
    #edge-right { right:0; }

    /* フラップ */
    #chat-flap {
      height:26px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      background: rgba(0,60,70,0.5);
      border-bottom:1px solid rgba(0,255,255,0.25);
      box-shadow:
        inset 0 -5px 10px rgba(0,255,255,0.25),
        inset 0  5px 10px rgba(0,120,150,0.35);
    }

    #chat-flap::before {
      content:''; position:absolute; top:0; left:0; right:0;
      height:3px;
      background: linear-gradient(90deg,
        rgba(0,255,255,1) 0%,
        rgba(0,150,200,0.8) 50%,
        rgba(0,255,255,1) 100%);
      box-shadow:0 0 16px rgba(0,255,255,1);
    }

    #flap-icon {
      width:44px; height:5px;
      background:rgba(0,255,255,0.6);
      border-radius:2px;
      box-shadow:0 0 10px rgba(0,255,255,0.9);
    }

    #chat-content {
      padding:14px 18px;
      height:80px; overflow-y:auto;
      background: rgba(0,20,30,0.35);
      backdrop-filter: blur(5px);
      border-top:1px solid rgba(0,255,255,0.25);
      border-bottom:1px solid rgba(0,255,255,0.25);
      transition:height .4s ease;
    }
    #chat-container.expanded #chat-content { height:48vh; }

    #chat-text {
      color:#fff; font-size:14px; line-height:1.75;
      text-shadow:0 0 6px rgba(0,255,255,0.5);
    }

    /* ボタン */
    #button-container {
      display:flex; gap:12px; padding:10px 14px 14px 14px;
    }

    .chat-button {
      flex:1; padding:13px 16px;
      border-radius:22px; border:none;
      font-size:14px; font-weight:600; cursor:pointer;
      background: linear-gradient(135deg,
        #ffffff 0%, #c8faff 40%, #8ef2ff 100%);
      color:#003344;
      box-shadow:
        inset 0 0 12px rgba(255,255,255,0.6),
        0 0 18px rgba(0,255,255,0.45);
    }

    .chat-button:active {
      transform:scale(0.95);
      background: linear-gradient(135deg,
        #eaffff 0%, #bdf5ff 40%, #7fe8ff 100%);
    }

    /* Retry */
    #retry-button {
      position:fixed; right:10px; bottom:210px;
      width:52px; height:52px; border-radius:50%;
      background:linear-gradient(135deg,#00eaff 0%,#0090c0 100%);
      border:none; color:#fff; font-size:12px; cursor:pointer;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      box-shadow:0 3px 20px rgba(0,255,255,0.6);
      z-index:15;
    }
    #retry-button svg { width:20px; height:20px; margin-bottom:2px; }
    #retry-button span { font-size:9px; }

    /* Debug */
    #debug-info {
      position:fixed; top:8px; left:8px;
      background:rgba(0,0,0,0.8);
      color:#0f0; font-size:11px;
      padding:10px; border-radius:5px;
      z-index:100; max-width:280px;
    }
    #debug-info.error { color:#f55; }

    /* Loading */
    #loading-screen {
      position:fixed; inset:0; background:linear-gradient(135deg,#06141f 0%,#122433 100%);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      z-index:1000; transition:opacity .5s ease;
    }
    #loading-screen.hidden { opacity:0; pointer-events:none; }

    .loading-spinner {
      width:60px; height:60px;
      border:4px solid rgba(0,200,255,0.2);
      border-top-color:#00c8ff; border-radius:50%;
      animation:spin 1s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    .loading-text { color:#fff; font-size:16px; margin-top:20px; }
    .loading-percent { color:#00c8ff; font-size:24px; font-weight:bold; margin-top:10px; }
  </style>
</head>

<body>
  <div id="loading-screen">
    <div class="loading-spinner"></div>
    <div class="loading-text">あかねを呼び出し中...</div>
    <div class="loading-percent" id="loading-percent">0%</div>
  </div>

  <video id="camera-video" autoplay playsinline muted></video>
  <canvas id="three-canvas"></canvas>

  <div id="debug-info">初期化中...</div>

  <button id="retry-button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M1 4v6h6M23 20v-6h-6"/>
      <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
    </svg>
    <span>やり直す</span>
  </button>

  <div id="chat-container">
    <div id="chat-panel">
      <div id="edge-left"></div>
      <div id="edge-right"></div>
      <div id="chat-flap" onclick="toggleChatPanel()">
        <div id="flap-icon"></div>
      </div>
      <div id="version-tag" style="position:absolute;top:28px;right:16px;color:#00eaff;font-size:10px;">
        GPT-AR02-STRONG
      </div>
      <div id="chat-content">
        <div id="chat-text">
          みなさんこんにちは。わたしはAIコンシェルジュのあかねです。<br>
          終活に関するご相談をお手伝いします。お気軽にお声がけくださいね。
        </div>
      </div>
      <div id="button-container">
        <button class="chat-button" id="btn-continue">会話を続ける</button>
        <button class="chat-button" id="btn-menu">メニューへ</button>
      </div>
    </div>
  </div>
</body>
</html>
