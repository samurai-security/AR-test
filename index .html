<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Avatar Chat</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #ui-layer {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 30%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; z-index: 10;
        }
        .chat-container {
            width: 90%; margin: 0 auto 20px auto;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ffff; border-radius: 10px; padding: 15px;
            pointer-events: auto; box-sizing: border-box; color: #fff;
        }
        .speaker-name { font-size: 14px; font-weight: bold; color: #00ffff; margin-bottom: 5px; }
        .message-text { font-size: 16px; line-height: 1.4; text-shadow: 1px 1px 2px black; }
    </style>

    <script>
        // 【Claude解析準拠】完全版スタビライザー
        // 位置はカメラの子要素で固定しつつ、
        // 回転は「ワールド空間でのカメラ方向」を計算してローカルに適用する
        AFRAME.registerComponent('billboard-stabilizer', {
            tick: function () {
                var el = this.el;
                var scene = this.el.sceneEl;
                if (!scene.camera) return;

                var cam = scene.camera;

                // 1. ワールド座標を取得（自分とカメラ）
                var myWorldPos = new THREE.Vector3();
                var camWorldPos = new THREE.Vector3();
                
                el.object3D.getWorldPosition(myWorldPos);
                cam.getWorldPosition(camWorldPos);

                // 2. 「理想のワールド回転」を計算する
                // ダミーオブジェクトを使って、「カメラの方を向く（ただし高さは無視）」回転を作る
                // これにより、Y軸回転（方位）はカメラに向き、X/Z回転（傾き）はゼロ（垂直）になる
                var dummy = new THREE.Object3D();
                dummy.position.copy(myWorldPos);
                // 自分の高さ(y)とカメラのX/Zを見て、水平に振り向く
                dummy.lookAt(camWorldPos.x, myWorldPos.y, camWorldPos.z);
                var targetWorldQuat = dummy.quaternion;

                // 3. ローカル回転に変換する
                // 子の回転 = 親の逆回転 × ワールドの目標回転
                var parentWorldQuat = new THREE.Quaternion();
                el.object3D.parent.getWorldQuaternion(parentWorldQuat);
                
                var parentInverse = parentWorldQuat.invert();
                var localQuat = parentInverse.multiply(targetWorldQuat);

                // 4. 適用
                el.object3D.quaternion.copy(localQuat);
            }
        });

        // 半透明機能
        AFRAME.registerComponent('model-opacity', {
            schema: { default: 0.7 },
            init: function () { this.el.addEventListener('model-loaded', this.update.bind(this)); },
            update: function () {
                var mesh = this.el.getObject3D('mesh');
                var data = this.data;
                if (!mesh) return;
                mesh.traverse(function (node) {
                    if (node.isMesh) {
                        node.material.transparent = true;
                        node.material.opacity = data;
                    }
                });
            }
        });
    </script>
</head>

<body>
    <div id="ui-layer">
        <div class="chat-container">
            <div class="speaker-name">AKANE</div>
            <div class="message-text">
                みなさんこんにちは。わたしはAIコンシェルジュのあかねです。<br>
                お金の使い方などを考える「終活AI」として、みなさんの人生設計をサポートします。
            </div>
        </div>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false">

        <a-assets>
            <a-asset-item id="akane-model" src="akane.glb"></a-asset-item>
        </a-assets>

        <a-entity camera look-controls>
            
            <a-entity position="0 -1.3 -3.5" billboard-stabilizer>
                
                <a-entity 
                    gltf-model="#akane-model" 
                    scale="1.8 1.8 1.8"
                    model-opacity="0.7">
                </a-entity>

            </a-entity>

        </a-entity>

    </a-scene>
</body>
</html>
