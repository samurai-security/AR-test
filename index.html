<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>AR Akane</title>

  <!-- 正しい順番：A-Frame → AR.js -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  renderer="colorManagement: true;"
  arjs="sourceType: webcam; debugUIEnabled: false;">

  <!-- asset -->
  <a-assets>
    <a-asset-item id="akaneModel" src="akane.glb"></a-asset-item>
  </a-assets>

  <!-- camera -->
  <a-entity id="cameraRig">
    <a-camera id="mainCamera"
              look-controls="magicWindowTrackingEnabled: true;">
    </a-camera>
  </a-entity>

  <!-- light -->
  <a-entity light="type: ambient; intensity: 1.0"></a-entity>

  <!-- GLTF キャラ -->
  <a-entity id="akane"
            gltf-model="#akaneModel"
            position="0 -1.05 -2.2"
            scale="1.5 1.5 1.5"
            billboard-follow-camera
            model-opacity="0.75">
  </a-entity>

</a-scene>

<!-- 透明化 -->
<script>
AFRAME.registerComponent("model-opacity", {
  schema: { type: "number", default: 0.75 },
  init: function () {
    this.el.addEventListener("model-loaded", () => {
      const mesh = this.el.getObject3D("mesh");
      if (!mesh) return;
      mesh.traverse(node => {
        if (node.isMesh) {
          const apply = (mat) => {
            mat.transparent = true;
            mat.opacity = this.data;
            mat.depthWrite = false;
          };
          Array.isArray(node.material)
            ? node.material.forEach(apply)
            : apply(node.material);
        }
      });
    });
  }
});
</script>
