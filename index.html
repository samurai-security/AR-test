<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Avatar Chat</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #ui-layer {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 30%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; z-index: 10;
        }
        .chat-container {
            width: 90%; margin: 0 auto 20px auto;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ffff; border-radius: 10px; padding: 15px;
            pointer-events: auto; box-sizing: border-box; color: #fff;
        }
        .speaker-name { font-size: 14px; font-weight: bold; color: #00ffff; margin-bottom: 5px; }
        .message-text { font-size: 16px; line-height: 1.4; text-shadow: 1px 1px 2px black; }
    </style>

    <script>
        // 【最終修正版】親回転キャンセル型ビルボード
        // カメラの子要素であっても、ワールド空間の「重力」と「カメラ方向」を正しく向くための
        // 補正回転（Local Quaternion）を毎フレーム計算する
        AFRAME.registerComponent('stabilized-billboard', {
            init: function() {
                // 計算用の変数を事前に作っておく（メモリ負荷軽減）
                this.dummy = new THREE.Object3D();
                this.myWorldPos = new THREE.Vector3();
                this.camWorldPos = new THREE.Vector3();
                this.parentWorldQuat = new THREE.Quaternion();
            },

            tick: function () {
                var el = this.el;
                var camera = this.el.sceneEl.camera;
                
                if (!camera) return;

                // 1. ワールド座標を取得（自分とカメラ）
                el.object3D.getWorldPosition(this.myWorldPos);
                camera.getWorldPosition(this.camWorldPos);

                // 2. 「理想の向き」をダミーオブジェクトで計算
                // ダミーを自分の場所に置き、カメラの方（ただし高さは自分と同じ高さ）を向かせる
                // これにより「垂直」かつ「カメラ目線」の回転データが作られる
                this.dummy.position.copy(this.myWorldPos);
                this.dummy.lookAt(this.camWorldPos.x, this.myWorldPos.y, this.camWorldPos.z);

                // 3. 親（カメラ）の回転を取得し、逆回転を作る
                el.object3D.parent.getWorldQuaternion(this.parentWorldQuat);
                this.parentWorldQuat.invert();

                // 4. 計算： ローカル回転 ＝ 親の逆回転 × 理想のワールド回転
                // これで、親が傾いていても打ち消され、理想の向きだけが残る
                this.parentWorldQuat.multiply(this.dummy.quaternion);

                // 5. 適用
                el.object3D.quaternion.copy(this.parentWorldQuat);
            }
        });

        // 半透明機能
        AFRAME.registerComponent('model-opacity', {
            schema: { default: 0.7 },
            init: function () { this.el.addEventListener('model-loaded', this.update.bind(this)); },
            update: function () {
                var mesh = this.el.getObject3D('mesh');
                var data = this.data;
                if (!mesh) return;
                mesh.traverse(function (node) {
                    if (node.isMesh) {
                        node.material.transparent = true;
                        node.material.opacity = data;
                    }
                });
            }
        });
    </script>
</head>

<body>
    <div id="ui-layer">
        <div class="chat-container">
            <div class="speaker-name">AKANE</div>
            <div class="message-text">
                修正完了しました。<br>
                座標は固定、かつ重力に従って直立します。<br>
                上を向けばアゴが見える挙動になっています。
            </div>
        </div>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false">

        <a-assets>
            <a-asset-item id="akane-model" src="akane.glb"></a-asset-item>
        </a-assets>

        <a-entity camera look-controls>
            
            <a-entity 
                gltf-model="#akane-model" 
                position="0 -1.3 -3.5"
                scale="1.8 1.8 1.8"
                model-opacity="0.7"
                stabilized-billboard>
            </a-entity>

        </a-entity>

    </a-scene>
</body>
</html>
