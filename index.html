<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Avatar Chat</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        
        #ui-layer {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 30%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; z-index: 10;
        }
        .chat-container {
            width: 90%; margin: 0 auto 20px auto;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ffff; border-radius: 10px; padding: 15px;
            pointer-events: auto; box-sizing: border-box; color: #fff;
        }
        .speaker-name { font-size: 14px; font-weight: bold; color: #00ffff; margin-bottom: 5px; }
        .message-text { font-size: 16px; line-height: 1.4; text-shadow: 1px 1px 2px black; }
    </style>

    <script>
        // 設定：ここをいじるだけで微調整できます
        const SETTINGS = {
            distance: 3.5,     // ★距離：近いと大きく、遠いと小さく見える
            heightOffset: -1.3, // ★高さ：プラスだと浮き、マイナスだと沈む
            followSpeed: 0.15   // ★追従速度：1.0で瞬時に追従、0.1でヌルっと追従
        };

        // 【最終仕様対応】水平維持・ジャイロ追従システム
        AFRAME.registerComponent('horizontal-tray', {
            init: function() {
                this.camera = document.querySelector('[camera]');
                this.targetPos = new THREE.Vector3(); // 計算用
            },

            tick: function (time, timeDelta) {
                if (!this.camera) return;

                const camObj = this.camera.object3D;
                const modelObj = this.el.object3D;

                // ---------------------------------------------------------
                // 1. 【要件：位置固定】ユーザーの「水平方向の正面」を計算する
                // ---------------------------------------------------------
                // カメラが今どこを向いているか取得
                const direction = new THREE.Vector3();
                camObj.getWorldDirection(direction);

                // ★重要★ 上下の傾き（Y成分）を強制的にゼロにする
                // これにより、空を見上げても「空」に移動せず、「水平線上の正面」に留まる
                direction.y = 0;
                direction.normalize(); // 長さを整える

                // 「カメラの位置」から「水平方向」へ「指定距離」進んだ場所を計算
                this.targetPos.copy(camObj.position).add(direction.multiplyScalar(SETTINGS.distance));

                // 高さはカメラの高さ＋オフセットで固定（上下動の抑制）
                // ※これにより「Y方向に傾けるとアゴが見える」挙動になる
                this.targetPos.y = camObj.position.y + SETTINGS.heightOffset;

                // ---------------------------------------------------------
                // 2. 【要件：座標固定】スムーズに移動（ガタつき防止）
                // ---------------------------------------------------------
                // 現在位置から目標位置まで少しずつ移動させる（Lerp）
                modelObj.position.lerp(this.targetPos, SETTINGS.followSpeed);

                // ---------------------------------------------------------
                // 3. 【要件：X傾き対応】常に直立し、かつユーザーを見る
                // ---------------------------------------------------------
                // キャラクターに「カメラの方」を向かせるが、
                // 自分の高さ(y)とカメラの高さ(y)を無視して水平回転だけさせる
                // これにより、スマホを横に傾けてもキャラは斜めにならず直立する
                modelObj.lookAt(camObj.position.x, modelObj.position.y, camObj.position.z);
            }
        });

        // 半透明化スクリプト
        AFRAME.registerComponent('model-opacity', {
            schema: { default: 0.7 },
            init: function () { this.el.addEventListener('model-loaded', this.update.bind(this)); },
            update: function () {
                var mesh = this.el.getObject3D('mesh');
                var data = this.data;
                if (!mesh) return;
                mesh.traverse(function (node) {
                    if (node.isMesh) {
                        node.material.transparent = true;
                        node.material.opacity = data;
                    }
                });
            }
        });
    </script>
</head>

<body>
    <div id="ui-layer">
        <div class="chat-container">
            <div class="speaker-name">AKANE</div>
            <div class="message-text">
                設定完了です。<br>
                上を向けばアゴが見え、<br>
                横に傾けても私は直立しています。
            </div>
        </div>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false">

        <a-assets>
            <a-asset-item id="akane-model" src="akane.glb"></a-asset-item>
        </a-assets>

        <a-entity camera look-controls></a-entity>

        <a-entity 
            gltf-model="#akane-model" 
            scale="1.8 1.8 1.8"
            model-opacity="0.7"
            horizontal-tray>
        </a-entity>

    </a-scene>
</body>
</html>
