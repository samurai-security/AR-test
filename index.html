<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Avatar Chat</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        /* 文字化け防止 & UIデザイン */
        body { margin: 0; overflow: hidden; font-family: "Helvetica Neue", Arial, sans-serif; }
        
        #ui-layer {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 30%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; z-index: 10;
        }
        .chat-container {
            width: 90%; margin: 0 auto 20px auto;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ffff; border-radius: 10px; padding: 15px;
            pointer-events: auto; box-sizing: border-box; color: #fff;
        }
        .speaker-name { font-size: 14px; font-weight: bold; color: #00ffff; margin-bottom: 5px; }
        .message-text { font-size: 16px; line-height: 1.4; text-shadow: 1px 1px 2px black; }
    </style>

    <script>
        // ★調整用パラメータ（ここを変えるだけでサイズや位置が変わります）
        const SETTINGS = {
            scale: 1.8,       // キャラクターの大きさ（1.8倍）
            distance: 4.0,    // カメラからの距離（メートル）
            yOffset: -1.6     // 画面中央よりどれくらい下げるか（全身を入れるため下げる）
        };

        // 【新機能】ジャイロ追従型ビルボード
        // カメラの子要素にはせず、計算で「常に目の前」に配置することで
        // 画面傾きに対する独立した姿勢制御（ジャイロ感）を実現する
        AFRAME.registerComponent('gyro-follower', {
            tick: function () {
                var camera = document.querySelector('[camera]');
                var model = this.el.object3D;
                var camObj = camera.object3D;

                if (!camObj) return;

                // 1. 位置の計算（XY軸固定）
                // カメラの「向いている方向」を取得
                var direction = new THREE.Vector3();
                camObj.getWorldDirection(direction); 
                // A-Frame(Three.js)のカメラはZマイナスを向いているため反転不要だが、
                // ベクトル計算として「カメラ位置 + (方向 * 距離)」を求める
                
                // カメラの位置
                var targetPos = new THREE.Vector3();
                targetPos.copy(camObj.position);

                // カメラの向いている方向の先に、指定距離ぶん進める
                // (directionは正規化されているため、距離を掛ける)
                direction.multiplyScalar(-SETTINGS.distance); // Zマイナス方向へ伸ばす
                targetPos.add(direction);

                // 2. 高さの補正（全身を映すためのY軸調整）
                // 単純にワールド座標系でYを下げる（カメラの傾きには依存させない＝ここがジャイロのキモ）
                targetPos.y += SETTINGS.yOffset;

                // 計算した位置にモデルを移動
                model.position.copy(targetPos);

                // 3. 向きの制御（目線固定）
                // モデルの位置から、カメラの位置を見る
                // lookAtはデフォルトで「Y軸（天井）を上」として計算するため、
                // スマホを傾けてもキャラクターは斜めにならず、垂直を保つ
                model.lookAt(camObj.position);
            }
        });

        // 半透明機能
        AFRAME.registerComponent('model-opacity', {
            schema: { default: 0.7 },
            init: function () { this.el.addEventListener('model-loaded', this.update.bind(this)); },
            update: function () {
                var mesh = this.el.getObject3D('mesh');
                var data = this.data;
                if (!mesh) return;
                mesh.traverse(function (node) {
                    if (node.isMesh) {
                        node.material.transparent = true;
                        node.material.opacity = data;
                    }
                });
            }
        });
    </script>
</head>

<body>
    <div id="ui-layer">
        <div class="chat-container">
            <div class="speaker-name">AKANE</div>
            <div class="message-text">
                これで完璧です。<br>
                スマホを傾けてみてください。<br>
                私は画面中央にいますが、姿勢は垂直を保ちます。
            </div>
        </div>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false">

        <a-assets>
            <a-asset-item id="akane-model" src="akane.glb"></a-asset-item>
        </a-assets>

        <a-entity camera look-controls></a-entity>

        <a-entity 
            gltf-model="#akane-model" 
            scale="1.8 1.8 1.8"
            model-opacity="0.7"
            gyro-follower>
        </a-entity>

    </a-scene>
</body>
</html>
