<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Concierge Akane</title>

  <!-- A-Frame と three.js -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    body, html {
      margin:0;
      padding:0;
      overflow:hidden;
      background:black;
    }

    /* UIレイヤー全体 */
    #ui-layer {
      position: fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      pointer-events:none;
      z-index:10;
    }

    /* 画像レイアウト（AR2.pngを分割したPNGを配置する前提） */
    .ui-img {
      position:absolute;
      width:100%;
      pointer-events:none;
    }

    #top-frame { top:0; }
    #bottom-frame { bottom:0; }

    /* チャット欄（ダミー） */
    #chat-box {
      position:absolute;
      bottom:12%;
      left:5%;
      width:90%;
      font-size:16px;
      line-height:1.6;
      color:white;
      z-index:20;
      pointer-events:none;
      text-shadow:0 0 8px rgba(0,0,0,0.9);
    }
  </style>
</head>

<body>

  <!-- A-Frame Scene -->
  <a-scene 
    vr-mode-ui="enabled: false"
    renderer="colorManagement: true; physicallyCorrectLights: true"
  >

    <!-- カメラ（向き取得に使用）-->
    <a-entity id="cameraRig">
      <a-camera id="mainCamera"></a-camera>
    </a-entity>

    <!-- 環境光 -->
    <a-entity light="type:ambient; intensity:0.9"></a-entity>
    <a-entity light="type:directional; intensity:0.4" position="1 1 1"></a-entity>

    <!-- 3D キャラ（XY座標固定）-->
    <a-entity id="akaneModel"
      position="0 -1.1 -2.2"
      scale="1.5 1.5 1.5"
      billboard-akane
      model-opacity="0.72"
      gltf-model="akane.glb">
    </a-entity>

  </a-scene>

  <!-- UIレイヤー -->
  <div id="ui-layer">
    <img id="top-frame" class="ui-img" src="top.png">
    <img id="bottom-frame" class="ui-img" src="bottom.png">
    <div id="chat-box">
      みなさんこんにちは。<br>
      わたしは AI コンシェルジュのあかねです。<br>
      今日は終活のご相談をサポートします。
    </div>
  </div>

  <!-- モデル透明度コンポーネント -->
  <script>
    AFRAME.registerComponent("model-opacity", {
      schema: { default: 0.7 },
      init: function () {
        this.el.addEventListener("model-loaded", this.update.bind(this));
      },
      update: function () {
        const mesh = this.el.getObject3D("mesh");
        if (!mesh) return;
        mesh.traverse((node) => {
          if (node.isMesh) {
            if (Array.isArray(node.material)) {
              node.material.forEach(m => {
                m.transparent = true;
                m.opacity = this.data;
                m.depthWrite = false;
              });
            } else {
              node.material.transparent = true;
              node.material.opacity = this.data;
              node.material.depthWrite = false;
            }
          }
        });
      }
    });
  </script>

  <!-- カメラに対するビルボード回転 -->
  <script>
    AFRAME.registerComponent("billboard-akane", {
      tick: function () {
        const cam = document.querySelector("#mainCamera").object3D;
        const obj = this.el.object3D;

        let camWorld = new THREE.Vector3();
        let objWorld = new THREE.Vector3();

        cam.getWorldPosition(camWorld);
        obj.getWorldPosition(objWorld);

        const dx = camWorld.x - objWorld.x;
        const dy = camWorld.y - objWorld.y;
        const dz = camWorld.z - objWorld.z;

        const yaw = Math.atan2(dx, dz);
        const pitch = Math.atan2(dy, Math.sqrt(dx*dx + dz*dz));

        obj.rotation.set(pitch, yaw, 0);   // Z(ロール)=0 で直立維持
      }
    });
  </script>

</body>
</html>
