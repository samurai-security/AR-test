<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Avatar Chat</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        
        #ui-layer {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 30%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; z-index: 10;
        }
        .chat-container {
            width: 90%; margin: 0 auto 20px auto;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ffff; border-radius: 10px; padding: 15px;
            pointer-events: auto; box-sizing: border-box; color: #fff;
        }
        .speaker-name { font-size: 14px; font-weight: bold; color: #00ffff; margin-bottom: 5px; }
        .message-text { font-size: 16px; line-height: 1.4; text-shadow: 1px 1px 2px black; }
    </style>

    <script>
        // 【最終決定版】Smart Gravity Billboard
        // キャラクターをカメラの子要素（位置固定）にした状態で、
        // 毎フレーム「重力に対して垂直になるよう」回転だけを強制補正する
        AFRAME.registerComponent('smart-billboard', {
            tick: function () {
                var camera = this.el.sceneEl.camera;
                if (!camera) return;

                // 1. ターゲット（カメラ）のワールド座標を取得
                var targetPos = new THREE.Vector3();
                camera.getWorldPosition(targetPos);

                // 2. 自分（キャラ）のワールド座標を取得
                var myPos = new THREE.Vector3();
                this.el.object3D.getWorldPosition(myPos);

                // 3. 高さを自分に合わせて「水平」にする
                // これにより、カメラが上にあろうが下にあろうが、
                // 「同じ高さにあるカメラ」を見るように回転するため、直立が保たれる
                targetPos.y = myPos.y;

                // 4. その方向を見る
                // A-Frame(Three.js)の lookAt は親要素の回転を考慮して
                // 自動的に逆算してくれるため、これで「カメラの傾き」が打ち消される
                this.el.object3D.lookAt(targetPos);
            }
        });

        // 半透明機能
        AFRAME.registerComponent('model-opacity', {
            schema: { default: 0.7 },
            init: function () { this.el.addEventListener('model-loaded', this.update.bind(this)); },
            update: function () {
                var mesh = this.el.getObject3D('mesh');
                var data = this.data;
                if (!mesh) return;
                mesh.traverse(function (node) {
                    if (node.isMesh) {
                        node.material.transparent = true;
                        node.material.opacity = data;
                    }
                });
            }
        });
    </script>
</head>

<body>
    <div id="ui-layer">
        <div class="chat-container">
            <div class="speaker-name">AKANE</div>
            <div class="message-text">
                これで解決です。<br>
                私はカメラにくっついているので位置はずれません。<br>
                でも、回転制御で常にまっすぐ立っています。
            </div>
        </div>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false">

        <a-assets>
            <a-asset-item id="akane-model" src="akane.glb"></a-asset-item>
        </a-assets>

        <a-entity camera look-controls>
            
            <a-entity 
                gltf-model="#akane-model" 
                position="0 -1.6 -3.5"
                scale="1.8 1.8 1.8"
                model-opacity="0.7"
                smart-billboard>
            </a-entity>

        </a-entity>

    </a-scene>
</body>
</html>
