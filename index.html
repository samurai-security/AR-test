<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Avatar Chat</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #ui-layer {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 30%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; z-index: 10;
        }
        .chat-container {
            width: 90%; margin: 0 auto 20px auto;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ffff; border-radius: 10px; padding: 15px;
            pointer-events: auto; box-sizing: border-box; color: #fff;
        }
        .speaker-name { font-size: 14px; font-weight: bold; color: #00ffff; margin-bottom: 5px; }
        .message-text { font-size: 16px; line-height: 1.4; text-shadow: 1px 1px 2px black; }
        #debug {
            position: absolute; top: 10px; left: 10px; color: #0f0; font-family: monospace;
            background: rgba(0,0,0,0.7); padding: 10px; font-size: 12px; z-index: 100;
        }
    </style>

    <script>
        AFRAME.registerComponent('simple-billboard', {
            tick: function () {
                var camera = this.el.sceneEl.camera;
                if (!camera) {
                    console.log("No camera found");
                    return;
                }

                var cameraPos = new THREE.Vector3();
                var characterPos = new THREE.Vector3();
                camera.getWorldPosition(cameraPos);
                this.el.object3D.getWorldPosition(characterPos);

                // デバッグ出力
                var debugEl = document.getElementById('debug');
                if (debugEl) {
                    debugEl.innerHTML = 
                        'Camera: ' + cameraPos.x.toFixed(2) + ', ' + cameraPos.y.toFixed(2) + ', ' + cameraPos.z.toFixed(2) + '<br>' +
                        'Character: ' + characterPos.x.toFixed(2) + ', ' + characterPos.y.toFixed(2) + ', ' + characterPos.z.toFixed(2);
                }

                // 方向ベクトルを計算
                var direction = new THREE.Vector3().subVectors(cameraPos, characterPos).normalize();

                // Y軸回転（ヨー）- 左右
                var yaw = Math.atan2(direction.x, direction.z);

                // X軸回転（ピッチ）- 上下
                var pitch = Math.asin(-direction.y);

                // Z軸回転（ロール）- 0固定で傾かない
                this.el.object3D.rotation.set(pitch, yaw, 0);
                
                console.log("Rotation - Pitch:", (pitch * 180 / Math.PI).toFixed(1), "Yaw:", (yaw * 180 / Math.PI).toFixed(1));
            }
        });

        AFRAME.registerComponent('model-opacity', {
            schema: { default: 0.7 },
            init: function () { this.el.addEventListener('model-loaded', this.update.bind(this)); },
            update: function () {
                var mesh = this.el.getObject3D('mesh');
                var data = this.data;
                if (!mesh) return;
                mesh.traverse(function (node) {
                    if (node.isMesh) {
                        node.material.transparent = true;
                        node.material.opacity = data;
                    }
                });
            }
        });
    </script>
</head>

<body>
    <div id="debug">Loading...</div>
    
    <div id="ui-layer">
        <div class="chat-container">
            <div class="speaker-name">AKANE</div>
            <div class="message-text">
                みなさんこんにちは。わたしはAIコンシェルジュのあかねです。<br>
                お金の使い方などを考える「終活AI」として、みなさんの人生設計をサポートします。
            </div>
        </div>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false">

        <a-assets>
            <a-asset-item id="akane-model" src="akane.glb"></a-asset-item>
        </a-assets>

        <a-camera look-controls></a-camera>

        <!-- 位置を調整: Y=0で画面中央、Y=-1だと下部になる -->
        <a-entity 
            gltf-model="#akane-model" 
            position="0 0 -3.5"
            scale="1.8 1.8 1.8"
            model-opacity="0.7"
            simple-billboard>
        </a-entity>

    </a-scene>
</body>
</html>
