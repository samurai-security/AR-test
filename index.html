<script>
AFRAME.registerComponent("billboard-follow-camera", {
  schema: { cameraId: { type: "string", default: "mainCamera" } },

  init: function () {
    this.cameraEl = null;
    this.camPos = new THREE.Vector3();
    this.objPos = new THREE.Vector3();
    this.model = null;

    // GLTF読み込み完了後にmesh取得
    this.el.addEventListener("model-loaded", () => {
      this.model = this.el.getObject3D("mesh");  // ← GLTFモデル本体
    });
  },

  tick: function () {
    if (!this.cameraEl) {
      this.cameraEl = document.getElementById(this.data.cameraId);
      if (!this.cameraEl) return;
    }
    if (!this.model) return; // ← GLTFがまだなら何もしない
