<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Avatar Chat</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #ui-layer {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 30%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; z-index: 10;
        }
        .chat-container {
            width: 90%; margin: 0 auto 20px auto;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ffff; border-radius: 10px; padding: 15px;
            pointer-events: auto; box-sizing: border-box; color: #fff;
        }
        .speaker-name { font-size: 14px; font-weight: bold; color: #00ffff; margin-bottom: 5px; }
        .message-text { font-size: 16px; line-height: 1.4; text-shadow: 1px 1px 2px black; }
    </style>

    <script>
        // 【完全修正版】XY回転対応 + Z回転禁止ビルボード
        AFRAME.registerComponent('stabilized-billboard', {
            init: function() {
                this.myWorldPos = new THREE.Vector3();
                this.camWorldPos = new THREE.Vector3();
                this.parentWorldQuat = new THREE.Quaternion();
                this.targetWorldQuat = new THREE.Quaternion();
                this.direction = new THREE.Vector3();
            },

            tick: function () {
                var el = this.el;
                var camera = this.el.sceneEl.camera;
                
                if (!camera) return;

                // 1. ワールド座標を取得
                el.object3D.getWorldPosition(this.myWorldPos);
                camera.getWorldPosition(this.camWorldPos);

                // 2. 方向ベクトルを計算
                this.direction.subVectors(this.camWorldPos, this.myWorldPos).normalize();

                // 3. Y軸回転（ヨー）とX軸回転（ピッチ）を計算
                var yaw = Math.atan2(this.direction.x, this.direction.z);
                var pitch = Math.asin(-this.direction.y);

                // 4. 目標のワールド回転を作成（Z軸=0で傾かない）
                this.targetWorldQuat.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));

                // 5. 親の回転を取得して逆回転を作る
                el.object3D.parent.getWorldQuaternion(this.parentWorldQuat);
                this.parentWorldQuat.invert();

                // 6. ローカル回転 = 親の逆回転 × 目標のワールド回転
                this.parentWorldQuat.multiply(this.targetWorldQuat);

                // 7. 適用
                el.object3D.quaternion.copy(this.parentWorldQuat);
            }
        });

        // 半透明機能
        AFRAME.registerComponent('model-opacity', {
            schema: { default: 0.7 },
            init: function () { this.el.addEventListener('model-loaded', this.update.bind(this)); },
            update: function () {
                var mesh = this.el.getObject3D('mesh');
                var data = this.data;
                if (!mesh) return;
                mesh.traverse(function (node) {
                    if (node.isMesh) {
                        node.material.transparent = true;
                        node.material.opacity = data;
                    }
                });
            }
        });
    </script>
</head>

<body>
    <div id="ui-layer">
        <div class="chat-container">
            <div class="speaker-name">AKANE</div>
            <div class="message-text">
                みなさんこんにちは。わたしはAIコンシェルジュのあかねです。<br>
                お金の使い方などを考える「終活AI」として、みなさんの人生設計をサポートします。
            </div>
        </div>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false">

        <a-assets>
            <a-asset-item id="akane-model" src="akane.glb"></a-asset-item>
        </a-assets>

        <a-entity camera look-controls>
            
            <a-entity 
                gltf-model="#akane-model" 
                position="0 -1 -3.5"
                scale="1.8 1.8 1.8"
                model-opacity="0.7"
                stabilized-billboard>
            </a-entity>

        </a-entity>

    </a-scene>
</body>
</html>
