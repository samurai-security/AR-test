<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Avatar Chat - GPT001</title>

  <!-- 必須ライブラリ -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #000;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* 画面下部のチャット UI レイヤー */
    #ui-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    #chat-box {
      width: 90%;
      margin-bottom: 24px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 2px solid #00f0ff;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 14px;
      line-height: 1.7;
      text-shadow: 0 0 4px rgba(0,0,0,0.8);
    }

    #chat-title {
      color: #00f0ff;
      font-weight: 600;
      margin-bottom: 4px;
    }

    #version {
      font-size: 11px;
      opacity: 0.8;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>

  <!-- ARシーン -->
  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="colorManagement:true; physicallyCorrectLights:true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- アセット -->
    <a-assets>
      <!-- 3Dモデル本体 -->
      <a-asset-item id="akane-model" src="akane.glb"></a-asset-item>
    </a-assets>

    <!-- カメラ（ID 必須） -->
    <a-entity id="cameraRig">
      <a-camera id="mainCamera"
                position="0 1.6 0"
                look-controls="magicWindowTrackingEnabled:true;">
      </a-camera>
    </a-entity>

    <!-- 環境光・方向光 -->
    <a-entity light="type: ambient; intensity: 0.9"></a-entity>
    <a-entity light="type: directional; intensity: 0.6" position="1 2 1"></a-entity>

    <!-- ARキャラクター：XY位置固定（position） -->
    <a-entity id="akane"
              gltf-model="#akane-model"
              position="0 -0.8 -2.5"
              scale="1.5 1.5 1.5"
              model-opacity="0.72"
              billboard-follow-camera>
    </a-entity>

  </a-scene>

  <!-- チャット UI レイヤー（ダミー文言＋バージョン） -->
  <div id="ui-layer">
    <div id="chat-box">
      <div id="chat-title">AKANE - claude011</div>
      <div id="version">【バージョン: GPT001】</div>
      <div>
        みなさんこんにちは。わたしは AI コンシェルジュのあかねです。<br>
        お金の使い方などを考える「終活AI」として、みなさんの人生設計をサポートします。
      </div>
    </div>
  </div>

  <!-- 半透明コンポーネント -->
  <script>
    AFRAME.registerComponent('model-opacity', {
      schema: { type: 'number', default: 0.7 },
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;

          const targetOpacity = this.data;

          mesh.traverse((node) => {
            if (!node.isMesh) return;

            const apply = (mat) => {
              mat.transparent = true;
              mat.opacity = targetOpacity;
              mat.depthWrite = false;
            };

            if (Array.isArray(node.material)) {
              node.material.forEach(apply);
            } else {
              apply(node.material);
            }
          });
        });
      }
    });
  </script>

  <!-- ビルボードコンポーネント（レビュー済みロジックを反映） -->
  <script>
    AFRAME.registerComponent('billboard-follow-camera', {
      init: function () {
        // カメラ取得（ID優先・フォールバック付き）
        const camEl =
          document.querySelector('#mainCamera') ||
          document.querySelector('[camera]');

        this.camera = camEl ? camEl.object3D : null;

        this.camPos = new THREE.Vector3();
        this.objPos = new THREE.Vector3();
        this.mesh = null;

        // GLTFモデル読み込み後に mesh を取得
        this.el.addEventListener('model-loaded', () => {
          this.mesh = this.el.getObject3D('mesh');
        });
      },

      tick: function () {
        if (!this.camera) return;
        if (!this.mesh) return;

        const model = this.mesh;

        // カメラとモデルのワールド座標
        this.camera.getWorldPosition(this.camPos);
        model.getWorldPosition(this.objPos);

        const dx = this.camPos.x - this.objPos.x;
        const dy = this.camPos.y - this.objPos.y;
        const dz = this.camPos.z - this.objPos.z;

        // Y軸回転（左右）
        const yaw = Math.atan2(dx, dz);

        // X軸回転（上下）
        const horizontal = Math.sqrt(dx * dx + dz * dz);
        const pitch = Math.atan2(dy, horizontal) * -1;

        // Z軸（ロール）は常に 0 = 直立
        model.rotation.set(pitch, yaw, 0);
      }
    });
  </script>

</body>
</html>
