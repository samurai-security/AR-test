<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Avatar Chat</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        
        #ui-layer {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 30%;
            pointer-events: none; z-index: 10;
            display: flex; justify-content: center; align-items: flex-end;
            padding-bottom: 20px;
        }
        .chat-container {
            width: 90%; background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ffff; border-radius: 10px;
            padding: 15px; color: #fff; pointer-events: auto;
            box-sizing: border-box;
        }
        .speaker-name { font-size: 14px; font-weight: bold; color: #00ffff; margin-bottom: 5px; }
        .message-text { font-size: 16px; line-height: 1.4; }
    </style>

    <script>
        // 【Ver: Gemini002】兄弟構造・完全水平追従
        // カメラの子要素にはせず、スクリプトで「カメラの水平前方」に位置を合わせる。
        // これにより、物理的な位置固定と、重力維持（直立）を両立する。
        AFRAME.registerComponent('world-lock-billboard', {
            init: function() {
                this.camera = document.querySelector('[camera]');
                // 距離設定（3.5m先に表示）
                this.distance = 3.5;
            },

            tick: function () {
                if (!this.camera) return;

                var camObj = this.camera.object3D;
                var modelObj = this.el.object3D;

                // --------------------------------------------------------
                // 1. 位置の計算：カメラの「水平方向の前」に移動
                // --------------------------------------------------------
                var camPos = new THREE.Vector3();
                camObj.getWorldPosition(camPos);

                var camDir = new THREE.Vector3();
                camObj.getWorldDirection(camDir);
                
                // Y成分（上下の向き）を捨てて、水平ベクトルにする
                // これにより、カメラが上を向いても、モデルは空に上がっていかない
                camDir.y = 0; 
                camDir.normalize();

                // カメラの位置から、水平方向に distance 分進んだ位置を決定
                var targetPos = new THREE.Vector3();
                targetPos.copy(camPos).add(camDir.multiplyScalar(this.distance));
                
                // 高さはカメラの高さから -1.3m 下げる（全身を入れるため）
                targetPos.y = camPos.y - 1.3;

                // 位置を適用
                modelObj.position.copy(targetPos);

                // --------------------------------------------------------
                // 2. 回転の計算：垂直を保ったままカメラを見る
                // --------------------------------------------------------
                // 「カメラのX,Z座標」と「モデル自身のY座標」を見ることで
                // 首を横に振る（Yaw）だけでカメラの方を向く
                // Pitch(上下)やRoll(傾き)は発生しない
                modelObj.lookAt(camPos.x, modelObj.position.y, camPos.z);
            }
        });

        // 半透明化
        AFRAME.registerComponent('model-opacity', {
            schema: { default: 0.7 },
            init: function () { this.el.addEventListener('model-loaded', this.update.bind(this)); },
            update: function () {
                var mesh = this.el.getObject3D('mesh');
                var data = this.data;
                if (!mesh) return;
                mesh.traverse(function (node) {
                    if (node.isMesh) {
                        node.material.transparent = true;
                        node.material.opacity = data;
                    }
                });
            }
        });
    </script>
</head>

<body>
    <div id="ui-layer">
        <div class="chat-container">
            <div class="speaker-name">AKANE (Gemini002)</div>
            <div class="message-text">
                バージョン管理を修正しました。<br>
                ・位置：カメラの水平前方（子要素ではない）<br>
                ・回転：Y軸のみでカメラを向く
            </div>
        </div>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true;">

        <a-assets>
            <a-asset-item id="akane-model" src="akane.glb"></a-asset-item>
        </a-assets>

        <a-entity camera look-controls></a-entity>

        <a-entity 
            world-lock-billboard
            model-opacity="0.7">
            
            <a-entity 
                gltf-model="#akane-model" 
                scale="1.8 1.8 1.8">
            </a-entity>
        </a-entity>

    </a-scene>
</body>
</html>
