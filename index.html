<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Avatar Chat - claude016 DEBUG</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #debug {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.8); color: #0f0;
            padding: 10px; font-family: monospace; font-size: 11px;
            z-index: 1000; max-width: 90%;
        }
        #ui-layer {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 30%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; z-index: 10;
        }
        .chat-container {
            width: 90%; margin: 0 auto 20px auto;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ffff; border-radius: 10px; padding: 15px;
            pointer-events: auto; box-sizing: border-box; color: #fff;
        }
        .speaker-name { font-size: 14px; font-weight: bold; color: #00ffff; margin-bottom: 5px; }
        .message-text { font-size: 16px; line-height: 1.4; text-shadow: 1px 1px 2px black; }
    </style>

    <script>
        AFRAME.registerComponent("debug-billboard", {
            init: function () {
                this.cameraEl = document.querySelector("#mainCamera") || document.querySelector("[camera]");
                this.camera = this.cameraEl ? this.cameraEl.object3D : null;
                this.mesh = null;
                this.frameCount = 0;
                
                this.el.addEventListener("model-loaded", () => {
                    this.mesh = this.el.getObject3D("mesh");
                    console.log("✅ Model loaded");
                });
                
                console.log("✅ Component initialized");
                console.log("Camera found:", !!this.camera);
                console.log("Entity position attribute:", this.el.getAttribute("position"));
            },

            tick: function () {
                this.frameCount++;
                
                if (!this.camera) {
                    if (this.frameCount % 60 === 0) {
                        console.log("❌ Camera not found");
                    }
                    return;
                }
                
                if (!this.mesh) {
                    if (this.frameCount % 60 === 0) {
                        console.log("⏳ Waiting for model...");
                    }
                    return;
                }
                
                // 座標取得
                var camPos = new THREE.Vector3();
                var entityPos = new THREE.Vector3();
                var meshPos = new THREE.Vector3();
                
                this.camera.getWorldPosition(camPos);
                this.el.object3D.getWorldPosition(entityPos);
                this.mesh.getWorldPosition(meshPos);
                
                // デバッグ表示（1秒ごと）
                if (this.frameCount % 60 === 0) {
                    var debugEl = document.getElementById('debug');
                    if (debugEl) {
                        debugEl.innerHTML = 
                            '<b>CAMERA:</b><br>' +
                            'X: ' + camPos.x.toFixed(2) + ' Y: ' + camPos.y.toFixed(2) + ' Z: ' + camPos.z.toFixed(2) + '<br><br>' +
                            '<b>ENTITY (should be 0, -0.8, -2.5):</b><br>' +
                            'X: ' + entityPos.x.toFixed(2) + ' Y: ' + entityPos.y.toFixed(2) + ' Z: ' + entityPos.z.toFixed(2) + '<br><br>' +
                            '<b>MESH:</b><br>' +
                            'X: ' + meshPos.x.toFixed(2) + ' Y: ' + meshPos.y.toFixed(2) + ' Z: ' + meshPos.z.toFixed(2) + '<br><br>' +
                            '<b>Position Attr:</b> ' + JSON.stringify(this.el.getAttribute("position"));
                    }
                    
                    console.log("Camera:", camPos);
                    console.log("Entity:", entityPos);
                    console.log("Mesh:", meshPos);
                }
                
                // ビルボード計算
                var dx = camPos.x - entityPos.x;
                var dy = camPos.y - entityPos.y;
                var dz = camPos.z - entityPos.z;
                
                var yaw = Math.atan2(dx, dz);
                var horizontal = Math.sqrt(dx * dx + dz * dz);
                var pitch = Math.atan2(dy, horizontal) * -1;
                
                this.mesh.rotation.set(pitch, yaw, 0);
            }
        });

        AFRAME.registerComponent('model-opacity', {
            schema: { default: 0.7 },
            init: function () { 
                this.el.addEventListener('model-loaded', this.update.bind(this)); 
            },
            update: function () {
                var mesh = this.el.getObject3D('mesh');
                var data = this.data;
                if (!mesh) return;
                mesh.traverse(function (node) {
                    if (node.isMesh) {
                        node.material.transparent = true;
                        node.material.opacity = data;
                    }
                });
            }
        });
    </script>
</head>

<body>
    <div id="debug">Loading...</div>
    
    <div id="ui-layer">
        <div class="chat-container">
            <div class="speaker-name">AKANE - claude016 DEBUG</div>
            <div class="message-text">
                デバッグモード起動中<br>
                画面左上に座標情報を表示します
            </div>
        </div>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false">

        <a-assets>
            <a-asset-item id="akane-model" src="akane.glb"></a-asset-item>
        </a-assets>

        <a-camera id="mainCamera" look-controls></a-camera>

        <a-entity 
            gltf-model="#akane-model" 
            position="0 -0.8 -2.5"
            scale="1.5 1.5 1.5"
            model-opacity="0.7"
            debug-billboard>
        </a-entity>

    </a-scene>
</body>
</html>
