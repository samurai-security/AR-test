<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Avatar Chat</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://unpkg.com/ar.js@3.3.2/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        
        #ui-layer {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 30%;
            pointer-events: none; z-index: 10;
            display: flex; justify-content: center; align-items: flex-end;
            padding-bottom: 20px;
        }
        .chat-container {
            width: 90%; background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ffff; border-radius: 10px;
            padding: 15px; color: #fff; pointer-events: auto;
            box-sizing: border-box;
        }
        .speaker-name { font-size: 14px; font-weight: bold; color: #00ffff; margin-bottom: 5px; }
        .message-text { font-size: 16px; line-height: 1.4; }
    </style>

    <script>
        // 【Ver: Gemini004】対面式スタビライザー
        // カメラの子要素（位置固定）にあるオブジェクトに対し、
        // 1. カメラの傾き（Pitch/Roll）を打ち消して垂直を保つ
        // 2. カメラの方位（Yaw）に対して180度反転し、正面を向かせる
        AFRAME.registerComponent('face-user-stabilizer', {
            tick: function () {
                var el = this.el;
                var camera = this.el.sceneEl.camera;
                
                if (!camera) return;

                // 1. カメラ（親）のワールド回転を取得
                var camQuat = new THREE.Quaternion();
                camera.getWorldQuaternion(camQuat);

                // 2. カメラの方位（Yaw）だけを取り出す
                var euler = new THREE.Euler().setFromQuaternion(camQuat, 'YXZ');
                
                // 3. 目標回転を作る
                //    カメラと同じ向きだと背中が見えるため、+180度(Math.PI)して対面させる
                var targetYaw = euler.y + Math.PI;
                
                //    Pitch(上下)=0, Roll(傾き)=0, Yaw=対面角度
                var targetQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, targetYaw, 0));

                // 4. 補正計算：親の回転をキャンセルして目標回転にする
                //    子の回転 = 親の逆回転 × 目標回転
                var parentInv = camQuat.clone().invert();
                var finalQuat = parentInv.multiply(targetQuat);

                // 5. 適用
                el.object3D.quaternion.copy(finalQuat);
            }
        });

        // 半透明化
        AFRAME.registerComponent('model-opacity', {
            schema: { default: 0.7 },
            init: function () { this.el.addEventListener('model-loaded', this.update.bind(this)); },
            update: function () {
                var mesh = this.el.getObject3D('mesh');
                var data = this.data;
                if (!mesh) return;
                mesh.traverse(function (node) {
                    if (node.isMesh) {
                        node.material.transparent = true;
                        node.material.opacity = data;
                    }
                });
            }
        });
    </script>
</head>

<body>
    <div id="ui-layer">
        <div class="chat-container">
            <div class="speaker-name">AKANE (Gemini004)</div>
            <div class="message-text">
                バージョン管理ルールを適用しました。<br>
                180度反転処理を追加し、<br>
                常に正面を向いて垂直に固定されます。
            </div>
        </div>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true;">

        <a-assets>
            <a-asset-item id="akane-model" src="akane.glb"></a-asset-item>
        </a-assets>

        <a-entity camera look-controls>
            
            <a-entity position="0 -1.3 -3.5" face-user-stabilizer>
                
                <a-entity 
                    gltf-model="#akane-model" 
                    scale="1.8 1.8 1.8"
                    model-opacity="0.7">
                </a-entity>

            </a-entity>

        </a-entity>
    </a-scene>
</body>
</html>
