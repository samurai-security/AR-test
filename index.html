<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Avatar Chat - claude013</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #ui-layer {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 30%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; z-index: 10;
        }
        .chat-container {
            width: 90%; margin: 0 auto 20px auto;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ffff; border-radius: 10px; padding: 15px;
            pointer-events: auto; box-sizing: border-box; color: #fff;
        }
        .speaker-name { font-size: 14px; font-weight: bold; color: #00ffff; margin-bottom: 5px; }
        .message-text { font-size: 16px; line-height: 1.4; text-shadow: 1px 1px 2px black; }
    </style>

    <script>
        AFRAME.registerComponent("billboard-follow-camera", {
            init: function () {
                // カメラ取得
                this.cameraEl = document.querySelector("#mainCamera") || document.querySelector("[camera]");
                this.camera = this.cameraEl ? this.cameraEl.object3D : null;
                
                // 座標用ベクトル
                this.camPos = new THREE.Vector3();
                this.modelPos = new THREE.Vector3();
                
                // GLTFメッシュ
                this.mesh = null;
                
                // モデル読み込み完了後
                this.el.addEventListener("model-loaded", () => {
                    this.mesh = this.el.getObject3D("mesh");
                    console.log("Model loaded");
                });
            },

            tick: function () {
                // 安全チェック
                if (!this.camera) return;
                if (!this.mesh) return;
                
                // カメラのワールド座標
                this.camera.getWorldPosition(this.camPos);
                
                // ★修正: エンティティ（this.el.object3D）のワールド座標を使用
                this.el.object3D.getWorldPosition(this.modelPos);
                
                // 方向ベクトル
                const dx = this.camPos.x - this.modelPos.x;
                const dy = this.camPos.y - this.modelPos.y;
                const dz = this.camPos.z - this.modelPos.z;
                
                // Y軸回転（ヨー）
                const yaw = Math.atan2(dx, dz);
                
                // X軸回転（ピッチ）
                const horizontal = Math.sqrt(dx * dx + dz * dz);
                const pitch = Math.atan2(dy, horizontal) * -1;
                
                // ★修正: メッシュに回転を適用
                this.mesh.rotation.set(pitch, yaw, 0);
            }
        });

        AFRAME.registerComponent('model-opacity', {
            schema: { default: 0.7 },
            init: function () { 
                this.el.addEventListener('model-loaded', this.update.bind(this)); 
            },
            update: function () {
                var mesh = this.el.getObject3D('mesh');
                var data = this.data;
                if (!mesh) return;
                mesh.traverse(function (node) {
                    if (node.isMesh) {
                        node.material.transparent = true;
                        node.material.opacity = data;
                    }
                });
            }
        });
    </script>
</head>

<body>
    <div id="ui-layer">
        <div class="chat-container">
            <div class="speaker-name">AKANE - claude013</div>
            <div class="message-text">
                みなさんこんにちは。わたしはAIコンシェルジュのあかねです。<br>
                お金の使い方などを考える「終活AI」として、みなさんの人生設計をサポートします。
            </div>
        </div>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false">

        <a-assets>
            <a-asset-item id="akane-model" src="akane.glb"></a-asset-item>
        </a-assets>

        <a-camera id="mainCamera" look-controls></a-camera>

        <a-entity 
            gltf-model="#akane-model" 
            position="0 -0.8 -2.5"
            scale="1.5 1.5 1.5"
            model-opacity="0.7"
            billboard-follow-camera>
        </a-entity>

    </a-scene>
</body>
</html>
