<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Avatar Chat</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        
        /* UIレイヤー */
        #ui-layer {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 30%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; z-index: 10;
        }
        .chat-container {
            width: 90%; margin: 0 auto 20px auto;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ffff; border-radius: 10px; padding: 15px;
            pointer-events: auto; box-sizing: border-box; color: #fff;
        }
        .speaker-name { font-size: 14px; font-weight: bold; color: #00ffff; margin-bottom: 5px; }
        .message-text { font-size: 16px; line-height: 1.4; text-shadow: 1px 1px 2px black; }
    </style>

    <script>
        // 設定：サイズや距離はここで調整してください
        const SETTINGS = {
            distance: 3.5,    // カメラからの水平距離（メートル）
            heightOffset: -1.5, // カメラの高さに対して、モデルをどれくらい下げるか
            smoothFactor: 0.1,  // 追従の滑らかさ（0.01?1.0）。小さいほどヌルっとしてガタつきが消える
            scale: 1.8          // モデルの大きさ
        };

        // 【修正版】重力固定・水平追従システム
        AFRAME.registerComponent('gravity-billboard', {
            init: function() {
                this.camera = document.querySelector('[camera]');
                // ガタつき防止用の「現在の目標位置」保持用
                this.targetPos = new THREE.Vector3();
            },

            tick: function () {
                if (!this.camera) return;
                
                const camObj = this.camera.object3D;
                const modelObj = this.el.object3D;

                // 1. カメラの「向き」を取得するが、Y軸（上下）の傾きは無視する
                // これにより、上を向いてもモデルは上に逃げず、ローアングルになる
                const camDir = new THREE.Vector3();
                camObj.getWorldDirection(camDir);
                camDir.y = 0; // 上下の成分を捨てる（水平成分のみ）
                camDir.normalize(); // 長さを1に戻す

                // 2. 目標位置を計算（カメラの位置 + 水平方向 * 距離）
                const targetPosition = new THREE.Vector3();
                targetPosition.copy(camObj.position);
                targetPosition.add(camDir.multiplyScalar(SETTINGS.distance));
                
                // 高さはカメラの高さ基準で固定（上下についてもこない＝ロー/ハイアングル実現）
                targetPosition.y = camObj.position.y + SETTINGS.heightOffset;

                // 3. 座標のガタつき防止（Lerp補間）
                // いきなりtargetPositionに飛ばず、少しずつ近づけることで手ブレを吸収する
                modelObj.position.lerp(targetPosition, SETTINGS.smoothFactor);

                // 4. 向きの制御（重力固定ビルボード）
                // まずカメラの方を向かせる
                modelObj.lookAt(camObj.position.x, modelObj.position.y, camObj.position.z);
                
                // lookAtだけだと変な回転が入ることがあるので、念の為X/Z回転をロックし直立を保つ
                modelObj.rotation.x = 0;
                modelObj.rotation.z = 0;
            }
        });

        // 半透明機能
        AFRAME.registerComponent('model-opacity', {
            schema: { default: 0.7 },
            init: function () { this.el.addEventListener('model-loaded', this.update.bind(this)); },
            update: function () {
                var mesh = this.el.getObject3D('mesh');
                var data = this.data;
                if (!mesh) return;
                mesh.traverse(function (node) {
                    if (node.isMesh) {
                        node.material.transparent = true;
                        node.material.opacity = data;
                    }
                });
            }
        });
    </script>
</head>

<body>
    <div id="ui-layer">
        <div class="chat-container">
            <div class="speaker-name">AKANE</div>
            <div class="message-text">
                お待たせしました。<br>
                これで「ガタつき」がなくなり、<br>
                上を見ればアゴが、横に傾けても私が直立して見えます。
            </div>
        </div>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false">

        <a-assets>
            <a-asset-item id="akane-model" src="akane.glb"></a-asset-item>
        </a-assets>

        <a-entity camera look-controls></a-entity>

        <a-entity 
            gltf-model="#akane-model" 
            scale="1.8 1.8 1.8"
            model-opacity="0.7"
            gravity-billboard>
        </a-entity>

    </a-scene>
</body>
</html>
