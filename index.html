<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Avatar Chat - claude007</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #ui-layer {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 30%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; z-index: 10;
        }
        .chat-container {
            width: 90%; margin: 0 auto 20px auto;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ffff; border-radius: 10px; padding: 15px;
            pointer-events: auto; box-sizing: border-box; color: #fff;
        }
        .speaker-name { font-size: 14px; font-weight: bold; color: #00ffff; margin-bottom: 5px; }
        .message-text { font-size: 16px; line-height: 1.4; text-shadow: 1px 1px 2px black; }
        #debug { position: absolute; top: 10px; left: 10px; color: lime; background: rgba(0,0,0,0.8); padding: 10px; font-family: monospace; font-size: 11px; z-index: 1000; }
    </style>

    <script>
        // claude007 - 強制的にカメラを取得して動作確認
        AFRAME.registerComponent('upright-billboard', {
            init: function() {
                console.log("Billboard initialized");
                this.camera = null;
                this.frameCount = 0;
            },

            tick: function() {
                this.frameCount++;

                // カメラを強制取得
                if (!this.camera) {
                    this.camera = this.el.sceneEl.camera;
                    if (this.camera) {
                        console.log("Camera found!");
                    } else {
                        if (this.frameCount % 60 === 0) {
                            console.log("Camera not found yet...");
                        }
                        return;
                    }
                }

                var object = this.el.object3D;

                // カメラとキャラの位置
                var cameraPos = new THREE.Vector3();
                var objectPos = new THREE.Vector3();
                this.camera.getWorldPosition(cameraPos);
                object.getWorldPosition(objectPos);

                // デバッグ表示
                if (this.frameCount % 30 === 0) {
                    var debugEl = document.getElementById('debug');
                    if (debugEl) {
                        debugEl.innerHTML = 
                            'Cam: ' + cameraPos.x.toFixed(2) + ',' + cameraPos.y.toFixed(2) + ',' + cameraPos.z.toFixed(2) + '<br>' +
                            'Obj: ' + objectPos.x.toFixed(2) + ',' + objectPos.y.toFixed(2) + ',' + objectPos.z.toFixed(2);
                    }
                }

                // 方向ベクトル
                var direction = new THREE.Vector3();
                direction.subVectors(cameraPos, objectPos);
                direction.normalize();

                // Y軸回転（ヨー）
                var yaw = Math.atan2(direction.x, direction.z);

                // X軸回転（ピッチ）
                var pitch = Math.asin(-direction.y);

                // デバッグ
                if (this.frameCount % 30 === 0) {
                    console.log("Yaw:", (yaw * 180 / Math.PI).toFixed(1), "Pitch:", (pitch * 180 / Math.PI).toFixed(1));
                }

                // Z軸は0固定
                object.rotation.set(pitch, yaw, 0);
            }
        });

        // 半透明機能
        AFRAME.registerComponent('model-opacity', {
            schema: { default: 0.7 },
            init: function () { 
                this.el.addEventListener('model-loaded', this.update.bind(this)); 
            },
            update: function () {
                var mesh = this.el.getObject3D('mesh');
                var data = this.data;
                if (!mesh) return;
                mesh.traverse(function (node) {
                    if (node.isMesh) {
                        node.material.transparent = true;
                        node.material.opacity = data;
                    }
                });
            }
        });
    </script>
</head>

<body>
    <div id="debug">Loading...</div>
    
    <div id="ui-layer">
        <div class="chat-container">
            <div class="speaker-name">AKANE - claude007</div>
            <div class="message-text">
                デバッグモード：画面左上に座標を表示
            </div>
        </div>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false">

        <a-assets>
            <a-asset-item id="akane-model" src="akane.glb"></a-asset-item>
        </a-assets>

        <a-camera look-controls></a-camera>

        <a-entity 
            gltf-model="#akane-model" 
            position="0 0 -2.5"
            scale="1.5 1.5 1.5"
            model-opacity="0.7"
            upright-billboard>
        </a-entity>

    </a-scene>
</body>
</html>
