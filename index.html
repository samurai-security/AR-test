<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Akane 3D Control Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    #info {
      position: fixed;
      top: 8px;
      left: 8px;
      right: 8px;
      padding: 6px 10px;
      background: rgba(0,0,0,0.45);
      font-size: 12px;
      line-height: 1.6;
      z-index: 10;
    }
    #info b {
      color: #00e0ff;
    }
    canvas {
      display: block;
    }
  </style>

  <!-- three.js & GLTFLoader -->
  <script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.155.0/examples/js/loaders/GLTFLoader.js"></script>
</head>

<body>
<div id="info">
  <b>Akane 3D 制御テスト</b><br>
  スマホ: 端末を上下左右に傾けるとキャラが追従します（roll=0固定）。<br>
  PC: マウスドラッグで向き確認できます。
</div>

<script>
  // =========================
  // 基本 three.js セットアップ
  // =========================
  let scene, camera, renderer;
  let akane = null;

  let targetYaw = 0;     // 左右（Y軸）
  let targetPitch = 0;   // 上下（X軸）
  let currentYaw = 0;
  let currentPitch = 0;

  let baseBeta = null;   // スマホ初期キャリブレーション（上下）
  let baseGamma = null;  // スマホ初期キャリブレーション（左右）
  let hasDeviceOrientation = false;
  let isMouseDown = false;
  let lastMouseX = 0;
  let lastMouseY = 0;

  init();
  animate();

  function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050810);

    const width = window.innerWidth;
    const height = window.innerHeight;

    camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
    camera.position.set(0, 1.6, 4);
    camera.lookAt(0, 1.2, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(width, height);
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(renderer.domElement);

    // ライト
    const hemi = new THREE.HemisphereLight(0xffffff, 0x222233, 1.0);
    hemi.position.set(0, 1, 0);
    scene.add(hemi);

    const dir = new THREE.DirectionalLight(0xffffff, 0.9);
    dir.position.set(1.5, 2.5, 1.0);
    scene.add(dir);

    const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
    fill.position.set(-2, 1, -1);
    scene.add(fill);

    // 簡易床
    const floorGeo = new THREE.CircleGeometry(1.0, 48);
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x101822, roughness: 0.9, metalness: 0.0
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;
    scene.add(floor);

    // =========================
    // GLB 読み込み
    // =========================
    const loader = new THREE.GLTFLoader();
    loader.load(
      "akane_Light.glb",
      function (gltf) {
        akane = gltf.scene;
        akane.position.set(0, 0, 0);
        akane.scale.set(1.3, 1.3, 1.3);

        // 半透明 0.72
        akane.traverse((node) => {
          if (node.isMesh) {
            const m = node.material;
            const apply = (mat) => {
              mat.transparent = true;
              mat.opacity = 0.72;
            };
            if (Array.isArray(m)) m.forEach(apply);
            else apply(m);
          }
        });

        scene.add(akane);
      },
      undefined,
      function (error) {
        console.error("GLB読み込み失敗:", error);
      }
    );

    window.addEventListener("resize", onWindowResize);

    // =========================
    // スマホ DeviceOrientation
    // =========================
    if (window.DeviceOrientationEvent) {
      window.addEventListener("deviceorientation", onDeviceOrientation, true);
    }

    // =========================
    // マウス（PC）コントロール
    // =========================
    renderer.domElement.addEventListener("mousedown", (e) => {
      isMouseDown = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    });
    window.addEventListener("mouseup", () => { isMouseDown = false; });

    window.addEventListener("mousemove", (e) => {
      if (!isMouseDown) return;
      handleDrag(e.clientX, e.clientY);
    });

    // スマホのタッチ
    window.addEventListener("touchstart", (e) => {
      if (e.touches.length > 0) {
        isMouseDown = true;
        lastMouseX = e.touches[0].clientX;
        lastMouseY = e.touches[0].clientY;
      }
    }, { passiv: true });

    window.addEventListener("touchend", () => { isMouseDown = false; });
    window.addEventListener("touchmove", (e) => {
      if (e.touches.length > 0) {
        handleDrag(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });
  }

  function onWindowResize() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
  }

  // =========================
  // DeviceOrientation（スマホ傾き）
  // =========================
  function onDeviceOrientation(event) {
    if (event.beta === null || event.gamma === null) return;

    if (baseBeta === null) {
      baseBeta = event.beta;
      baseGamma = event.gamma;
    }

    const deltaBeta = event.beta - baseBeta;     // 上下
    const deltaGamma = event.gamma - baseGamma;  // 左右

    const pitchScale = 0.7; // 感度調整
    const yawScale   = 0.7;

    targetPitch = THREE.Math.degToRad(deltaBeta  * pitchScale);
    targetYaw   = THREE.Math.degToRad(deltaGamma * yawScale);

    // 挙動の安定化
    const maxPitch = THREE.Math.degToRad(40);
    const maxYaw   = THREE.Math.degToRad(60);
    targetPitch = THREE.Math.clamp(targetPitch, -maxPitch, maxPitch);
    targetYaw   = THREE.Math.clamp(targetYaw, -maxYaw, maxYaw);
  }

  // =========================
  // マウス回転（PC用）
  // =========================
  function handleDrag(x, y) {
    const dx = x - lastMouseX;
    const dy = y - lastMouseY;

    lastMouseX = x;
    lastMouseY = y;

    const yawSpeed = 0.01;
    const pitchSpeed = 0.01;

    targetYaw   += dx * yawSpeed;
    targetPitch += dy * pitchSpeed;

    const maxPitch = THREE.Math.degToRad(60);
    targetPitch = THREE.Math.clamp(targetPitch, -maxPitch, maxPitch);
  }

  // =========================
  // 毎フレーム更新
  // =========================
  function animate() {
    requestAnimationFrame(animate);

    if (akane) {
      const lerpFactor = 0.12;
      currentYaw   += (targetYaw   - currentYaw)   * lerpFactor;
      currentPitch += (targetPitch - currentPitch) * lerpFactor;

      // roll=0（直立固定）
      akane.rotation.set(currentPitch, currentYaw, 0);
    }

    renderer.render(scene, camera);
  }
</script>

</body>
</html>
