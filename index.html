<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Avatar Chat</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: "Helvetica Neue", Arial, sans-serif; }

        /* UIレイヤー */
        #ui-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 20px;
        }

        .chat-box {
            position: relative;
            width: 90%;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ffff;
            border-radius: 10px;
            box-sizing: border-box;
            padding: 15px;
            color: #fff;
            pointer-events: auto;
        }

        .name-label {
            font-size: 14px;
            color: #00ffff;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .message-content {
            font-size: 16px;
            line-height: 1.4;
        }
    </style>

    <script>
        // 【Ver: Gemini003】重力維持スタビライザー
        // 位置はカメラの子要素(XY固定) + 回転は重力維持(Pitch/Rollキャンセル)
        AFRAME.registerComponent('gravity-fix', {
            tick: function () {
                var el = this.el;
                var camera = this.el.sceneEl.camera;
                
                if (!camera) return;

                // 1. カメラ（親）のワールド回転を取得
                var camQuat = new THREE.Quaternion();
                camera.getWorldQuaternion(camQuat);

                // 2. 「水平方向（Yaw）」成分だけ抽出
                var euler = new THREE.Euler().setFromQuaternion(camQuat, 'YXZ');
