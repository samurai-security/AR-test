<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>AR Avatar - Akane</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      width: 100%;
      height: 100%;
    }

    #camera-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    #three-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #chat-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 0 10px 20px 10px;
    }

    #chat-box {
      background: linear-gradient(135deg, rgba(0, 40, 60, 0.85) 0%, rgba(0, 60, 80, 0.85) 100%);
      border: 1px solid rgba(0, 200, 255, 0.4);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      position: relative;
      box-shadow: 0 0 20px rgba(0, 180, 255, 0.2);
    }

    #chat-text {
      color: #fff;
      font-size: 15px;
      line-height: 1.7;
    }

    #version-tag {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 10px;
      color: rgba(0, 200, 255, 0.6);
    }

    #button-container {
      display: flex;
      gap: 12px;
    }

    .chat-button {
      flex: 1;
      padding: 14px 20px;
      border-radius: 25px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #ffffff 0%, #e8e8e8 100%);
      color: #333;
    }

    .chat-button:active {
      transform: scale(0.96);
    }

    #retry-button {
      position: fixed;
      right: 15px;
      bottom: 200px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00c8ff 0%, #0090c0 100%);
      border: none;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 180, 255, 0.4);
      z-index: 10;
    }

    #retry-button svg {
      width: 20px;
      height: 20px;
      margin-bottom: 2px;
    }

    #retry-button span {
      font-size: 9px;
    }

    #debug-info {
      position: fixed;
      top: 8px;
      left: 8px;
      background: rgba(0,0,0,0.8);
      color: #0f0;
      font-size: 11px;
      padding: 10px;
      border-radius: 5px;
      z-index: 100;
      max-width: 280px;
    }

    #debug-info.error {
      color: #f55;
    }

    /* ローディング画面 */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0a1520 0%, #1a2a3a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.5s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(0, 200, 255, 0.2);
      border-top-color: #00c8ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: #fff;
      font-size: 16px;
      margin-top: 20px;
    }

    .loading-percent {
      color: #00c8ff;
      font-size: 24px;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <!-- ローディング画面 -->
  <div id="loading-screen">
    <div class="loading-spinner"></div>
    <div class="loading-text">あかねを呼び出し中...</div>
    <div class="loading-percent" id="loading-percent">0%</div>
  </div>

  <video id="camera-video" autoplay playsinline muted></video>
  <canvas id="three-canvas"></canvas>

  <div id="debug-info">初期化中...</div>

  <button id="retry-button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M1 4v6h6M23 20v-6h-6"/>
      <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
    </svg>
    <span>やり直す</span>
  </button>

  <div id="chat-container">
    <div id="chat-box">
      <div id="version-tag">Claude025</div>
      <div id="chat-text">
        みなさんこんにちは。わたしはAIコンシェルジュのあかねです。<br>
        終活に関するご相談をお手伝いします。
      </div>
    </div>
    <div id="button-container">
      <button class="chat-button" id="btn-continue">会話を続ける</button>
      <button class="chat-button" id="btn-menu">メニューへ</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    let scene, camera, renderer;
    let akane = null;
    let modelLoaded = false;

    let targetYaw = 0;
    let targetPitch = 0;
    let currentYaw = 0;
    let currentPitch = 0;

    let baseBeta = null;
    let baseGamma = null;
    let orientationInitialized = false;
    let canInitializeOrientation = false;

    let isDragging = false;
    let lastX = 0;
    let lastY = 0;

    const debugEl = document.getElementById('debug-info');

    function log(msg, isError = false) {
      console.log(msg);
      debugEl.textContent = msg;
      if (isError) debugEl.classList.add('error');
      else debugEl.classList.remove('error');
    }

    // 初期化
    init();

    async function init() {
      try {
        log('カメラ起動中...');
        await setupCamera();
        
        log('Three.js初期化...');
        setupThreeJS();
        
        log('モデル読み込み中: akane.glb');
        await loadModel();
        
        setupEventListeners();
        animate();
        
      } catch (err) {
        log('エラー: ' + err.message, true);
        console.error(err);
      }
    }

    // カメラ映像取得
    async function setupCamera() {
      const video = document.getElementById('camera-video');
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        console.warn('背面カメラ失敗:', err);
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });
        video.srcObject = stream;
      }
    }

    // Three.js セットアップ
    function setupThreeJS() {
      const canvas = document.getElementById('three-canvas');
      const width = window.innerWidth;
      const height = window.innerHeight;

      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 100);
      // カメラ設定（モデル高さ2.0、FOV50度から逆算）
      camera.position.set(0, 1.3, 4.2);
      camera.lookAt(0, 0.7, 0);

      renderer = new THREE.WebGLRenderer({ 
        canvas: canvas,
        antialias: true, 
        alpha: true 
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.setClearColor(0x000000, 0);

      // ライト
      const ambient = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambient);

      const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
      mainLight.position.set(1, 2, 2);
      scene.add(mainLight);

      const fillLight = new THREE.DirectionalLight(0x88ccff, 0.5);
      fillLight.position.set(-2, 1, -1);
      scene.add(fillLight);
    }

    // 3Dモデル読み込み
    function loadModel() {
      return new Promise((resolve, reject) => {
        const loader = new GLTFLoader();
        
        loader.load(
          'akane.glb',
          function(gltf) {
            akane = gltf.scene;
            
            // 原点がモデル中心(Y=0)にあるため、Y=1.0で足元をY=0に配置
            akane.position.set(0, 1.0, 0);
            akane.scale.set(1.0, 1.0, 1.0);

            // 半透明化
            akane.traverse((node) => {
              if (node.isMesh) {
                const materials = Array.isArray(node.material) ? node.material : [node.material];
                materials.forEach(mat => {
                  mat.transparent = true;
                  mat.opacity = 0.75;
                });
              }
            });

            scene.add(akane);
            modelLoaded = true;
            canInitializeOrientation = true;
            
            // ローディング画面を非表示
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.classList.add('hidden');
            
            log('準備完了');
            resolve();
          },
          function(progress) {
            if (progress.total > 0) {
              const pct = Math.round(progress.loaded / progress.total * 100);
              document.getElementById('loading-percent').textContent = pct + '%';
            }
          },
          function(error) {
            log('モデル読み込み失敗: ' + error.message, true);
            reject(error);
          }
        );
      });
    }

    // イベントリスナー
    function setupEventListeners() {
      window.addEventListener('resize', onResize);

      // デバイスオリエンテーション
      if (window.DeviceOrientationEvent) {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          document.body.addEventListener('click', requestOrientationPermission, { once: true });
          log('画面をタップしてジャイロを有効化');
        } else {
          window.addEventListener('deviceorientation', onDeviceOrientation, true);
        }
      }

      // マウス操作
      const canvas = document.getElementById('three-canvas');
      canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
      });
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', () => { isDragging = false; });

      // タッチ操作
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) {
          isDragging = true;
          lastX = e.touches[0].clientX;
          lastY = e.touches[0].clientY;
        }
      }, { passive: true });
      window.addEventListener('touchmove', onTouchMove, { passive: true });
      window.addEventListener('touchend', () => { isDragging = false; });

      // やり直すボタン
      document.getElementById('retry-button').addEventListener('click', resetOrientation);
    }

    async function requestOrientationPermission() {
      try {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission === 'granted') {
          window.addEventListener('deviceorientation', onDeviceOrientation, true);
          log('ジャイロ有効化完了');
        }
      } catch (err) {
        log('ジャイロ権限エラー: ' + err.message, true);
      }
    }

    // デバイスオリエンテーション
    function onDeviceOrientation(event) {
      if (event.beta === null || event.gamma === null) return;
      
      // モデル読み込み完了かつ初期化許可されるまで基準を設定しない
      if (!orientationInitialized && canInitializeOrientation) {
        baseBeta = event.beta;
        baseGamma = event.gamma;
        orientationInitialized = true;
        log('基準設定完了 Yaw:0 Pitch:0');
      }
      
      if (!orientationInitialized) return;

      let deltaBeta = event.beta - baseBeta;
      let deltaGamma = event.gamma - baseGamma;

      const sensitivity = 1.2;
      
      // キャラがカメラの方を向く
      targetYaw = THREE.MathUtils.degToRad(-deltaGamma * sensitivity);
      targetPitch = THREE.MathUtils.degToRad(-deltaBeta * sensitivity * 0.5);

      const maxYaw = THREE.MathUtils.degToRad(70);
      const maxPitch = THREE.MathUtils.degToRad(30);
      
      targetYaw = THREE.MathUtils.clamp(targetYaw, -maxYaw, maxYaw);
      targetPitch = THREE.MathUtils.clamp(targetPitch, -maxPitch, maxPitch);

      updateDebug();
    }

    function onMouseMove(e) {
      if (!isDragging) return;
      
      const deltaX = e.clientX - lastX;
      const deltaY = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;

      const rotSpeed = 0.008;
      targetYaw -= deltaX * rotSpeed;
      targetPitch -= deltaY * rotSpeed * 0.5;

      const maxYaw = THREE.MathUtils.degToRad(70);
      const maxPitch = THREE.MathUtils.degToRad(40);
      targetYaw = THREE.MathUtils.clamp(targetYaw, -maxYaw, maxYaw);
      targetPitch = THREE.MathUtils.clamp(targetPitch, -maxPitch, maxPitch);

      updateDebug();
    }

    function onTouchMove(e) {
      if (!isDragging || e.touches.length === 0) return;
      
      const x = e.touches[0].clientX;
      const y = e.touches[0].clientY;
      const deltaX = x - lastX;
      const deltaY = y - lastY;
      lastX = x;
      lastY = y;

      const rotSpeed = 0.008;
      targetYaw -= deltaX * rotSpeed;
      targetPitch -= deltaY * rotSpeed * 0.5;

      const maxYaw = THREE.MathUtils.degToRad(70);
      const maxPitch = THREE.MathUtils.degToRad(40);
      targetYaw = THREE.MathUtils.clamp(targetYaw, -maxYaw, maxYaw);
      targetPitch = THREE.MathUtils.clamp(targetPitch, -maxPitch, maxPitch);

      updateDebug();
    }

    function resetOrientation() {
      targetYaw = 0;
      targetPitch = 0;
      baseBeta = null;
      baseGamma = null;
      orientationInitialized = false;
      canInitializeOrientation = true; // 即座に再設定可能
      log('リセット - 次の傾きを基準に設定');
    }

    function onResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    function updateDebug() {
      const yawDeg = THREE.MathUtils.radToDeg(targetYaw).toFixed(1);
      const pitchDeg = THREE.MathUtils.radToDeg(targetPitch).toFixed(1);
      log('Yaw:' + yawDeg + '° Pitch:' + pitchDeg + '°');
    }

    // アニメーションループ
    function animate() {
      requestAnimationFrame(animate);

      if (akane) {
        const lerpFactor = 0.1;
        currentYaw += (targetYaw - currentYaw) * lerpFactor;
        currentPitch += (targetPitch - currentPitch) * lerpFactor;

        // Z軸=0で直立維持
        akane.rotation.set(currentPitch, currentYaw, 0);
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
