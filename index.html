<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Avatar Chat</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        /* UIレイヤーのスタイル（完成イメージ AR2.jpg をCSSで再現） */
        body { margin: 0; overflow: hidden; font-family: "Helvetica Neue", Arial, sans-serif; }
        
        /* チャットエリア（画面下部） */
        #ui-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%; /* 画面下部30%を占有 */
            pointer-events: none; /* AR操作を邪魔しないように */
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            z-index: 10;
        }

        /* チャットボックス風の画像コンテナ */
        .chat-container {
            width: 90%;
            margin: 0 auto 20px auto;
            background: rgba(0, 0, 0, 0.6); /* 画像がないための仮デザイン（半透明黒） */
            border: 2px solid #00ffff; /* サイバー風の枠線 */
            border-radius: 10px;
            padding: 15px;
            pointer-events: auto; /* チャット欄は操作可能に */
            box-sizing: border-box;
            color: #fff;
            position: relative;
        }

        /* 画像素材がある場合は、上のbackground等を消してこのimgを使う */
        .chat-bg-image {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            display: none; /* 画像がないので今は非表示 */
        }

        .speaker-name {
            font-size: 14px;
            font-weight: bold;
            color: #00ffff;
            margin-bottom: 5px;
        }

        .message-text {
            font-size: 16px;
            line-height: 1.4;
            text-shadow: 1px 1px 2px black;
        }

        /* ローディング画面 */
        .arjs-loader {
            height: 100%; width: 100%; position: absolute; top: 0; left: 0;
            background-color: rgba(0, 0, 0, 0.8); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
        }
        .arjs-loader div {
            text-align: center; font-size: 1.25em; color: white;
        }
    </style>

    <script>
        // 【ビルボード機能】常にカメラの方を向く
        AFRAME.registerComponent('always-look-at', {
            schema: { type: 'selector' },
            tick: function () {
                var target = this.data;
                var object = this.el.object3D;
                if (target) {
                    object.lookAt(target.object3D.position);
                }
            }
        });

        // 【半透明機能】GLBモデルの不透明度を強制変更する
        AFRAME.registerComponent('model-opacity', {
            schema: { default: 0.7 }, // デフォルト透過度 0.7
            init: function () {
                this.el.addEventListener('model-loaded', this.update.bind(this));
            },
            update: function () {
                var mesh = this.el.getObject3D('mesh');
                var data = this.data;
                if (!mesh) return;
                
                mesh.traverse(function (node) {
                    if (node.isMesh) {
                        node.material.transparent = true;
                        node.material.opacity = data;
                        // 両面描画（必要であれば）
                        // node.material.side = THREE.DoubleSide; 
                    }
                });
            }
        });
    </script>
</head>

<body>
    <div class="arjs-loader">
        <div>Loading AR...</div>
    </div>

    <div id="ui-layer">
        <div class="chat-container">
            <img src="path/to/chat_bg.png" class="chat-bg-image" alt="">
            
            <div class="speaker-name">AKANE</div>
            <div class="message-text">
                こんにちは！<br>
                プロデューサーさん、聞こえていますか？<br>
                AR空間へようこそ。
            </div>
        </div>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        renderer="logarithmicDepthBuffer: true; colorManagement: true;"
        vr-mode-ui="enabled: false">

        <a-assets>
            <a-asset-item id="akane-model" src="akane.glb"></a-asset-item>
        </a-assets>

        <a-entity camera id="cam" look-controls></a-entity>

        <a-entity 
            gltf-model="#akane-model" 
            position="0 0 -4"
            scale="1 1 1"
            always-look-at="#cam"
            model-opacity="0.7">
        </a-entity>

    </a-scene>
</body>
</html>
