<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Avatar Chat</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        
        #ui-layer {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 30%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; z-index: 10;
        }
        .chat-container {
            width: 90%; margin: 0 auto 20px auto;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ffff; border-radius: 10px; padding: 15px;
            pointer-events: auto; box-sizing: border-box; color: #fff;
        }
        .speaker-name { font-size: 14px; font-weight: bold; color: #00ffff; margin-bottom: 5px; }
        .message-text { font-size: 16px; line-height: 1.4; text-shadow: 1px 1px 2px black; }
    </style>

    <script>
        const SETTINGS = {
            distance: 3.5,     
            heightOffset: -1.3, 
            followSpeed: 0.15   
        };

        // 【修正版】安全装置付き・水平維持システム
        AFRAME.registerComponent('safe-horizontal-tray', {
            init: function() {
                this.camera = document.querySelector('[camera]');
                this.targetPos = new THREE.Vector3();
                // 起動直後の消失を防ぐため、初期位置を仮設定
                this.targetPos.set(0, -1.3, -3.5); 
            },

            tick: function (time, timeDelta) {
                if (!this.camera) return;

                const camObj = this.camera.object3D;
                const modelObj = this.el.object3D;

                // 1. カメラの向きを取得
                const direction = new THREE.Vector3();
                camObj.getWorldDirection(direction);

                // 2. Y成分（高さ）を捨てる
                direction.y = 0;

                // ★ここが修正点：安全装置★
                // 真下や真上を向くと、directionの長さがほぼ0になり、normalizeでエラー(NaN)になる
                // その場合、計算をスキップして「前の位置」を維持する（消滅防止）
                if (direction.lengthSq() < 0.001) {
                    return; 
                }

                direction.normalize();

                // 3. 目標位置の計算
                // 「水平方向」へ移動
                this.targetPos.copy(camObj.position).add(direction.multiplyScalar(SETTINGS.distance));
                // 高さはカメラ基準で固定
                this.targetPos.y = camObj.position.y + SETTINGS.heightOffset;

                //
