<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Avatar Chat</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        
        /* UIレイヤー */
        #ui-layer {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 30%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; z-index: 10;
        }
        .chat-container {
            width: 90%; margin: 0 auto 20px auto;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ffff; border-radius: 10px; padding: 15px;
            pointer-events: auto; box-sizing: border-box; color: #fff;
        }
        .speaker-name { font-size: 14px; font-weight: bold; color: #00ffff; margin-bottom: 5px; }
        .message-text { font-size: 16px; line-height: 1.4; text-shadow: 1px 1px 2px black; }
    </style>

    <script>
        // 【決定版】ゴンドラ制御システム
        // カメラの「横回転(Y)」と「位置」だけをコピーする
        // 数学的なベクトル計算を使わないため、バグで消えることがない
        AFRAME.registerComponent('camera-yaw-lock', {
            init: function () {
                this.camera = document.querySelector('[camera]');
            },
            tick: function () {
                if (!this.camera) return;

                var rig = this.el.object3D;
                var cam = this.camera.object3D;

                // 1. 位置をカメラと完全に同期させる
                rig.position.copy(cam.position);

                // 2. 回転を同期させるが、少し工夫する
                // カメラの回転情報（クォータニオン）から、Y軸（水平）の角度だけを抽出する
                var camEuler = new THREE.Euler();
                camEuler.setFromQuaternion(cam.quaternion, 'YXZ');

                // 3. ゴンドラの回転をセット（XとZは0に固定＝水平維持）
                // これにより、スマホを傾けてもキャラクターは直立不動になる
                rig.rotation.set(0, camEuler.y, 0);
            }
        });

        // 半透明機能
        AFRAME.registerComponent('model-opacity', {
            schema: { default: 0.7 },
            init: function () { this.el.addEventListener('model-loaded', this.update.bind(this)); },
            update: function () {
                var mesh = this.el.getObject3D('mesh');
                var data = this.data;
                if (!mesh) return;
                mesh.traverse(function (node) {
                    if (node.isMesh) {
                        node.material.transparent = true;
                        node.material.opacity = data;
                    }
                });
            }
        });
    </script>
</head>

<body>
    <div id="ui-layer">
        <div class="chat-container">
            <div class="speaker-name">AKANE</div>
            <div class="message-text">
                お待たせしました！<br>
                今度こそ消えません。<br>
                上や下を向くと、アングルが変わりますよ。
            </div>
        </div>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false">

        <a-assets>
            <a-asset-item id="akane-model" src="akane.glb"></a-asset-item>
        </a-assets>

        <a-entity camera look-controls></a-entity>

        <a-entity camera-yaw-lock>
            
            <a-entity 
                gltf-model="#akane-model" 
                position="0 -1.6 -3.5"
                scale="1.8 1.8 1.8"
                model-opacity="0.7">
            </a-entity>

        </a-entity>

    </a-scene>
</body>
</html>
